name: 'Setup Atlas'
description: 'Installs a specific version of Atlas'
branding:
  icon: database
  color: 'blue'
author: 'step-security'
inputs:
  version:
    description: 'Which version of Atlas to install, in the format of "v0.14.1"'
    required: false
    default: 'latest'
  flavor:
    description: 'Which flavor of Atlas to install'
    required: false
  cloud-token:
    description: API token to authenticate to an Atlas Cloud organization
    required: false
runs:
  using: "composite"
  steps:
    - name: Subscription check
      env:
        REPO_PRIVATE: ${{ github.event.repository.private }}
      run: |
        # validate subscription status
        UPSTREAM="ariga/setup-atlas"
        ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
        DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

        echo ""
        echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
        echo "Secure drop-in replacement for $UPSTREAM"
        if [ "$REPO_PRIVATE" = "false" ]; then
          echo -e "\033[32m✓ Free for public repositories\033[0m"
        fi
        echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
        echo ""

        if [ "$REPO_PRIVATE" != "false" ]; then
          SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

          if [ "$SERVER_URL" != "https://github.com" ]; then
            BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
          else
            BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
          fi

          API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

          RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

          if [ $CURL_EXIT_CODE -ne 0 ]; then
            echo "Timeout or API not reachable. Continuing to next step."
          elif [ "$RESPONSE" = "403" ]; then
            echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
            echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
            exit 1
          fi
        fi
      shell: bash
    - name: Prepare Atlas Install
      id: atlas-install
      if: runner.os != 'Windows'
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FLAVOR: ${{ inputs.flavor }}
      run: |
        version="$INPUT_VERSION"
        if [[ ! "$version" =~ ^[A-Za-z0-9._+-]+$ ]]; then
          echo "::error::Invalid version '$version'. Use latest or a version such as v0.14.1."
          exit 1
        fi
        if [ -n "$INPUT_FLAVOR" ]; then
          version="extended-$version"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "dir=$HOME/.atlas-bin" >> "$GITHUB_OUTPUT"
        # Cache keys cannot contain commas, keep them to a safe character set.
        echo "key=atlas-bin-v1-$RUNNER_OS-$RUNNER_ARCH-${version//[^A-Za-z0-9._-]/_}-" >> "$GITHUB_OUTPUT"
    - name: Restore Atlas Binary
      id: atlas-bin-cache
      if: runner.os != 'Windows'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.atlas-install.outputs.dir }}
        # Saved keys carry the installed build, so this never hits exactly and
        # always falls back to the most recent entry for this version.
        key: ${{ steps.atlas-install.outputs.key }}
        restore-keys: |
          ${{ steps.atlas-install.outputs.key }}
    - name: Install Atlas
      id: atlas-install-run
      if: runner.os != 'Windows'
      shell: bash
      env:
        ATLAS_VERSION: ${{ steps.atlas-install.outputs.version }}
        ATLAS_BIN_DIR: ${{ steps.atlas-install.outputs.dir }}
      run: |
        mkdir -p "$ATLAS_BIN_DIR"
        # The installer skips the download if the binary at the target path
        # (e.g. restored from the cache) already matches the requested version.
        # The installer verifies the binary against the .sha256 published next to it.
        curl -sSf https://atlasgo.sh | CI=true sh -s -- -o "$ATLAS_BIN_DIR/atlas"
        echo "$ATLAS_BIN_DIR" >> "$GITHUB_PATH"
        # The exact build (e.g. v1.3.8-f6d4fcb-canary) names the cache entry.
        installed="$("$ATLAS_BIN_DIR/atlas" version | awk 'NR==1 {print $3}')"
        echo "installed=${installed//[^A-Za-z0-9._-]/_}" >> "$GITHUB_OUTPUT"
    - name: Save Atlas Binary
      # Only save when the binary changed: caches are immutable and keyed by the installed build.
      if: >-
        runner.os != 'Windows' &&
        steps.atlas-bin-cache.outputs.cache-matched-key != format('{0}{1}', steps.atlas-install.outputs.key, steps.atlas-install-run.outputs.installed)
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.atlas-install.outputs.dir }}
        key: ${{ steps.atlas-install.outputs.key }}${{ steps.atlas-install-run.outputs.installed }}
    - name: Install Atlas (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_FLAVOR: ${{ inputs.flavor }}
      run: |
        $ErrorActionPreference = 'Stop'
        $version = $env:INPUT_VERSION
        if ($version -notmatch '^[A-Za-z0-9._+-]+$') {
          Write-Output "::error::Invalid version '$version'. Use latest or a version such as v0.14.1."
          exit 1
        }
        if ($env:INPUT_FLAVOR -ne "") {
          $version = "extended-$version"
        }
        $url = "https://atlasbinaries.com/atlas/atlas-windows-amd64-$version.exe"
        $targetPath = "$env:LocalAppData\Programs\Atlas"
        $exePath = Join-Path $targetPath "atlas.exe"
        New-Item -Path $targetPath -ItemType Directory -Force | Out-Null
        curl.exe -fsSL $url -o $exePath
        if ($LASTEXITCODE -ne 0 -or -not (Test-Path $exePath)) {
          Write-Output "::error::Failed to download Atlas from $url"
          exit 1
        }
        # Verify against the checksum published next to the binary. Only a mismatch fails the step.
        $want = $null
        try {
          $want = (Invoke-RestMethod -Uri "$url.sha256" -UseBasicParsing -TimeoutSec 30).ToString().Trim().Split()[0].ToLower()
        } catch {
          Write-Output "::warning::Could not fetch checksum from $url.sha256, skipping verification: $($_.Exception.Message)"
        }
        if ($want) {
          $got = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want) {
            Remove-Item $exePath -Force
            Write-Output "::error::Checksum mismatch for atlas.exe: expected $want, got $got"
            exit 1
          }
          Write-Output "Checksum verified: $got"
        }
        Add-Content $env:GITHUB_PATH "$targetPath"
    - name: Trim Token
      if: inputs.cloud-token != ''
      id: trim_token
      shell: bash
      env:
        RAW: ${{ inputs.cloud-token }}
      run: |
        TRIMMED=$(echo "$RAW" | xargs)
        echo "trimmed=$TRIMMED" >> "$GITHUB_OUTPUT"
    - name: Cache Atlas Grant
      if: steps.trim_token.outputs.trimmed != ''
      uses: actions/cache@v6
      with:
        # Cache only the grant files; the CLI's other state under ~/.atlas is not needed across runs.
        path: |
          ~/.atlas/token.db
          ~/.atlas/release.json
        key: atlas-grant-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          atlas-grant-${{ runner.os }}-
    - name: Login to Atlas
      if: steps.trim_token.outputs.trimmed != ''
      shell: bash
      env:
        TOKEN: ${{ steps.trim_token.outputs.trimmed }}
      run: atlas login --token "$TOKEN" --grant-only
    - name: Expose Grant
      if: steps.trim_token.outputs.trimmed != ''
      shell: bash
      env:
        TOKEN: ${{ steps.trim_token.outputs.trimmed }}
      run: echo "ATLAS_TOKEN=$TOKEN" >> "$GITHUB_ENV"
